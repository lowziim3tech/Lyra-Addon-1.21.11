plugins {
    id "fabric-loom" version "1.14.10"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "MeteorReleases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "MeteorSnapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

loom {
    mixin {
        defaultRefmapName = "lyradebug-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    manifest {
        attributes(
            "Fabric-Jar-Type": "classes",
            "Fabric-Loom-Mixin-Remap-Type": "static",
            "Fabric-Mapping-Namespace": "intermediary"
        )
    }
}
